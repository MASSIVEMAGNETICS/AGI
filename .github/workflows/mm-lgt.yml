name: MM-LGT

on:
  pull_request:
    paths:
      - "packages/mm-lgt/**"
      - ".github/workflows/mm-lgt.yml"
  push:
    branches:
      - main
    paths:
      - "packages/mm-lgt/**"
      - ".github/workflows/mm-lgt.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/mm-lgt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/mm-lgt/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q bando_lgt run_lgt_demo.py
      - name: Test
        run: python -m pytest -q
      - name: CPU smoke test
        run: python run_lgt_demo.py --steps 2 --no-sample --memory-path "${{ runner.temp }}/mm-lgt-smoke.sqlite3"
